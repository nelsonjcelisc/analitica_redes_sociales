  #   tty: true
  #   volumes:
  #     - .:/app  # Mapeo espejo de tu carpeta actual
  #   environment:
  #     - TZ=America/Bogota
  #     - MONGO_URI=mongodb://localhost:27017/
  #     - DISPLAY=${DISPLAY:-:0} # Toma el display del host
  #     - /tmp/.X11-unix:/tmp/.X11-unix # Comparte el socket de video
